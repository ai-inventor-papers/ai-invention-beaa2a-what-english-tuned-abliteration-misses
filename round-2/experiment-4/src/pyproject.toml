[project]
name = "c1-behaviour-bilingual"
version = "0.1.0"
description = "C1 BEHAVIOUR: bilingual (EN/SL) safety evaluation of four core Heretic checkpoints + a community reference"
requires-python = ">=3.12,<3.13"
# Pinned to the exact versions installed in .venv (uv pip freeze). torch is the cu128 wheel:
#   uv pip install --python .venv/bin/python --index-strategy unsafe-best-match \
#     --extra-index-url https://download.pytorch.org/whl/cu128 -r env/requirements.lock
# env/requirements.lock holds the complete transitive freeze; this list is the direct dependency set.
dependencies = [
  "torch==2.11.0+cu128",
  "transformers==5.17.0",
  "peft==0.21.0",
  "bitsandbytes==0.50.2",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "huggingface-hub==1.32.0",
  "sentencepiece==0.2.2",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "matplotlib==3.11.2",
  "fasttext-wheel==0.9.2",
  "aiohttp==3.14.3",
  "tiktoken==0.14.0",
  "tenacity==9.1.4",
  "loguru==0.7.3",
  "pyyaml==6.0.3",
  "psutil==7.2.2",
  "jsonschema==4.26.0",
]
