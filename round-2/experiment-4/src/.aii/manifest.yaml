entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cu128 -r env/requirements.lock"
  - path: __pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated automatically on the next import (or: find . -name __pycache__ -prune -exec rm -rf {} +)"
