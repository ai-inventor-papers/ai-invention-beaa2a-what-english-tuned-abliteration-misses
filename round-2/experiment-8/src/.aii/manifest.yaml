entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: __pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated automatically on the next `.venv/bin/python method.py ...` import"
  - path: results_mini/
    delete: regenerable
    source: ".venv/bin/python method.py --model gemma --mini   # T3 smoke run (8 items per set)"
  - path: results/gemma/acts/
    delete: regenerable
    source: "rm -rf results/gemma/acts && .venv/bin/python method.py --model gemma   # resumes and recomputes only the pos -1 residual caches"
  - path: results/gams3/acts/
    delete: regenerable
    source: "rm -rf results/gams3/acts && .venv/bin/python method.py --model gams3   # resumes and recomputes only the pos -1 residual caches"
  - path: results/gemma/dolly_B_ref.npz
    keep: top-k reference distributions that define the KL collateral of every Gemma arm; deleting them changes what a rerun measures
  - path: results/gams3/dolly_B_ref.npz
    keep: top-k reference distributions that define the KL collateral of every GaMS3 arm
