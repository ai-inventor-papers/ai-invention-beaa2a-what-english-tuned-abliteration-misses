requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "loguru==0.7.3",
    "pyyaml==6.0.3",
    "transformers==5.17.0",
    "tokenizers==0.23.2",
    "sentencepiece==0.2.2",
    "huggingface-hub==1.33.0",
    "openai==3.19.2",
    "aiohttp==3.14.3",
    "matplotlib==3.11.2",
]
