entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: __pycache__/
    delete: regenerable
    source: "recreated automatically on the next import of common.py / alib.py / interventions.py"
  - path: judge/__pycache__/
    delete: regenerable
    source: "recreated automatically on the next import of judge/local_judge.py"
  - path: results/ref_dolly_topk.npz
    delete: regenerable
    source: "rm -f results/ref_dolly_topk.npz && .venv/bin/python method.py --stage smoke   # rebuilds the top-512 reference distribution used for the harmless-KL column"
