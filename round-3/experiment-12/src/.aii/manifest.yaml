# Only large binaries and cache directories need a decision here. Everything else in this workspace is text or code
# (source, JSON, JSONL, CSV, YAML, markdown, logs) or sits under the auto-keep floor, so it is kept automatically:
# that includes all of results/ except the PC bases below, plus data/, configs/, figures/ and method_out*.json.
entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml --extra-index-url https://download.pytorch.org/whl/cu128 --index-strategy unsafe-best-match"
  - path: results/*/harmless_pcs.npy
    delete: regenerable
    source: "source env.sh && .venv/bin/python code/run_model.py --model <gemma|qwen3|mistral> --phase dev  (rebuilt inside build_directions, then split out again by code/cleanup.py)"
  - path: code/__pycache__/
    delete: regenerable
    source: "regenerated automatically by CPython on the next import; or: .venv/bin/python -c 'import compileall; compileall.compile_dir(\"code\")'"
