entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cu128 -r env/requirements.base.lock && uv pip install --python .venv/bin/python --no-deps -e third_party/heretic && uv pip install --python .venv/bin/python fasttext-numpy2-wheel openai"
  - path: __pycache__/
    delete: regenerable
    source: "created automatically by any .venv/bin/python run of the scripts in this directory"
  - path: third_party/heretic/src/heretic/__pycache__/
    delete: regenerable
    source: "created automatically when the editable Heretic install is imported"
  - path: third_party/heretic/src/heretic/scorers/__pycache__/
    delete: regenerable
    source: "created automatically when the editable Heretic install is imported"
