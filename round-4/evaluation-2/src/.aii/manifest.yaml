entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cu128 --index-strategy unsafe-best-match"
  - path: scripts/__pycache__/
    delete: regenerable
    source: "python -m compileall scripts"
  - path: results/
    keep: re-analysis of 56,866 judged generations plus 755 bought gpt-4.1 labels, an NF4 guard pass and bf16 generations; not reproducible without re-spending
